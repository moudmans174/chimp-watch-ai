# CHIMP-WATCH AI — full stack.
#   cp .env.example .env   # then set strong secrets
#   docker compose up -d --build
# Web UI on http://localhost:8090 (set CW_WEB_PORT in .env to change)
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: chimpwatch
      POSTGRES_USER: chimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimp -d chimpwatch"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    environment:
      CW_DATABASE_URL: postgresql+psycopg://chimp:${POSTGRES_PASSWORD}@db:5432/chimpwatch
      CW_REDIS_URL: redis://redis:6379/0
      CW_PUBLIC_URL: ${CW_PUBLIC_URL:-http://localhost:8090}
      # Photos are stored on a Docker volume. For S3-compatible storage instead, set
      # CW_STORAGE_BACKEND=s3 plus CW_S3_ENDPOINT_URL / CW_S3_ACCESS_KEY / CW_S3_SECRET_KEY in .env.
      CW_STORAGE_BACKEND: ${CW_STORAGE_BACKEND:-local}
      CW_STORAGE_LOCAL_DIR: /app/media
    volumes: [media:/app/media]

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on: [api]
    env_file: .env
    environment:
      CW_DATABASE_URL: postgresql+psycopg://chimp:${POSTGRES_PASSWORD}@db:5432/chimpwatch
      CW_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true   # the worker serves no HTTP; the image health check is for the API

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    # Change CW_WEB_PORT (and CW_PUBLIC_URL to match) in .env if this port is already in use
    ports: ["${CW_WEB_PORT:-8090}:80"]

volumes:
  dbdata:
  media:
