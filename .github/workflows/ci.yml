name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: chimp, POSTGRES_PASSWORD: chimp, POSTGRES_DB: chimpwatch_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U chimp" --health-interval 5s --health-retries 20
    env:
      CW_DATABASE_URL: postgresql+psycopg://chimp:chimp@localhost:5432/chimpwatch_test
      CW_REDIS_URL: ""
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head && alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
