# CHIMP-WATCH AI — full stack.
#   cp .env.example .env   # then set strong secrets
#   docker compose up -d --build
# Web UI on http://localhost:8080
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: chimpwatch
      POSTGRES_USER: chimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimp -d chimpwatch"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    env_file: .env
    environment:
      CW_DATABASE_URL: postgresql+psycopg://chimp:${POSTGRES_PASSWORD}@db:5432/chimpwatch
      CW_REDIS_URL: redis://redis:6379/0
      CW_STORAGE_BACKEND: s3
      CW_S3_ENDPOINT_URL: http://minio:9000
      CW_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      CW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on: [api]
    env_file: .env
    environment:
      CW_DATABASE_URL: postgresql+psycopg://chimp:${POSTGRES_PASSWORD}@db:5432/chimpwatch
      CW_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  dbdata:
  miniodata:
